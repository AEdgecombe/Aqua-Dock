<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" fill="none" role="img" aria-label="Aqua Dock">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37B6F0"/>
      <stop offset="1" stop-color="#1E63D6"/>
    </linearGradient>
    <linearGradient id="dockg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cfe2f7" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BD0FF"/><stop offset="1" stop-color="#1E7FE0"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4EE7CE"/><stop offset="1" stop-color="#12A38C"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A7CFF"/><stop offset="1" stop-color="#4A2FD0"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5EE68C"/><stop offset="1" stop-color="#1FA254"/></linearGradient>
    <linearGradient id="t5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC24D"/><stop offset="1" stop-color="#F0821E"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0a2a4a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- aqua bubbles -->
  <circle cx="120" cy="60" r="38" fill="#37B6F0" opacity="0.10"/>
  <circle cx="612" cy="72" r="26" fill="#12A38C" opacity="0.10"/>

  <!-- wordmark -->
  <text x="360" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#word)" letter-spacing="1">Aqua Dock</text>
  <text x="360" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#8494a6" letter-spacing="3">macOS-STYLE DOCK FOR GNOME SHELL</text>

  <!-- glossy dock capsule -->
  <g filter="url(#soft)">
    <rect x="170" y="150" width="380" height="66" rx="22" fill="url(#dockg)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1"/>
    <rect x="176" y="154" width="368" height="26" rx="16" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- app tiles -->
  <g>
    <g><rect x="222" y="161" width="44" height="44" rx="11" fill="url(#t1)"/><rect x="226" y="164" width="36" height="16" rx="8" fill="#ffffff" opacity="0.30"/></g>
    <g><rect x="280" y="161" width="44" height="44" rx="11" fill="url(#t2)"/><rect x="284" y="164" width="36" height="16" rx="8" fill="#ffffff" opacity="0.30"/></g>
    <g><rect x="338" y="161" width="44" height="44" rx="11" fill="url(#t3)"/><rect x="342" y="164" width="36" height="16" rx="8" fill="#ffffff" opacity="0.30"/></g>
    <g><rect x="396" y="161" width="44" height="44" rx="11" fill="url(#t4)"/><rect x="400" y="164" width="36" height="16" rx="8" fill="#ffffff" opacity="0.30"/></g>
    <g><rect x="454" y="161" width="44" height="44" rx="11" fill="url(#t5)"/><rect x="458" y="164" width="36" height="16" rx="8" fill="#ffffff" opacity="0.30"/></g>
  </g>

  <!-- running indicator dots -->
  <g fill="#5a6b7d" opacity="0.55">
    <circle cx="244" cy="227" r="2.5"/>
    <circle cx="302" cy="227" r="2.5"/>
    <circle cx="476" cy="227" r="2.5"/>
  </g>
</svg>
